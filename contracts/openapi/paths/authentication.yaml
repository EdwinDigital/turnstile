paths:
  /api/v1/auth/login:
    post:
      summary: Start a password session
      operationId: loginWithPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/PasswordLogin
        required: true
      responses:
        '200':
          description: Signed-in profile and session cookie
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Profile
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security: []
      tags:
      - Authentication
  /api/v1/auth/entra:
    post:
      summary: Exchange a verified Microsoft ID token for a session
      operationId: loginWithEntra
      requestBody:
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/EntraLogin
        required: true
      responses:
        '200':
          description: Signed-in profile and session cookie
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Profile
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security: []
      tags:
      - Authentication
  /api/v1/auth/me:
    get:
      summary: Read the current session profile
      operationId: getCurrentProfile
      responses:
        '200':
          description: Current signed-in profile
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Profile
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
      tags:
      - Authentication
  /api/v1/auth/logout:
    post:
      summary: Revoke the current session when present
      operationId: logout
      responses:
        '204':
          description: Session revoked and cookie cleared
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security: []
      tags:
      - Authentication
