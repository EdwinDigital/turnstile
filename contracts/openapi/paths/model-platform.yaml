paths:
  /api/v1/model-management/model-availability:
    get:
      tags: [Model Control Plane]
      operationId: listModelAvailability
      summary: Read desired and verified model availability
      description: Owner-only consistent state and latest operation snapshot. Unknown or stale target coverage never becomes verified success.
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Model availability snapshots
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: ../../openapi.yaml#/components/schemas/ModelAvailabilityList}
        '401': {description: Authentication required}
        '403': {description: Owner session required}
        '503': {description: Model availability storage is unavailable}
  /api/v1/model-management/models/{item_id}/availability:
    parameters:
    - name: item_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      tags: [Model Control Plane]
      operationId: getModelAvailability
      summary: Read one model's desired and verified state
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Latest desired state and independent effective evidence
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: ../../openapi.yaml#/components/schemas/ModelAvailabilityReadback}
        '401': {description: Authentication required}
        '403': {description: Owner session required}
        '404': {description: Unknown model availability identity}
        '503': {description: Model availability storage is unavailable}
    put:
      tags: [Model Control Plane]
      operationId: changeModelAvailability
      summary: Submit an idempotent versioned model availability command
      description: Requires fresh coverage of every target, the current expected revision and a unique intent key. Returns an accepted operation, not effective success. Does not modify prices, default selection, assignments or budgets. Ordinary model PUT cannot change enabled.
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ../../openapi.yaml#/components/schemas/ModelAvailabilityCommand}
      responses:
        '202':
          description: Versioned operation accepted or exact intent replayed
          headers:
            Location:
              schema: {type: string}
              description: Relative status URL for the same operation
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: ../../openapi.yaml#/components/schemas/ModelAvailabilityAccepted}
        '401': {description: Authentication required}
        '403': {description: Owner session and allowed write origin required}
        '409': {description: 'Stale revision, conflicting intent, pending operation or removal'}
        '422': {description: 'Invalid strict Boolean, revision or idempotency key'}
        '503': {description: Availability storage or complete target coverage unavailable}
  /api/v1/model-management/model-availability/operations/{operation_id}:
    get:
      tags: [Model Control Plane]
      operationId: getModelAvailabilityOperation
      summary: Read an immutable availability intent and its observed progress
      security: [{sessionCookie: []}]
      parameters:
      - name: operation_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Operation and per-target evidence
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: ../../openapi.yaml#/components/schemas/ModelAvailabilityOperation}
        '401': {description: Authentication required}
        '403': {description: Owner session required}
        '404': {description: Unknown operation}
        '503': {description: Model availability storage is unavailable}
  /api/v1/model-management/model-availability/operations/{operation_id}/retry:
    post:
      tags: [Model Control Plane]
      operationId: retryModelAvailabilityOperation
      summary: Retry the same failed availability operation
      description: Retains the original operation, intent and desired revision. Requires matching current revision and coverage; at most three manual retries are permitted.
      security: [{sessionCookie: []}]
      parameters:
      - name: operation_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ../../openapi.yaml#/components/schemas/ModelAvailabilityRetry}
      responses:
        '202':
          description: Existing operation accepted for retry
          headers:
            Location:
              schema: {type: string}
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: ../../openapi.yaml#/components/schemas/ModelAvailabilityAccepted}
        '401': {description: Authentication required}
        '403': {description: Owner session and allowed write origin required}
        '409': {description: 'Revision changed, operation ineligible or retry limit reached'}
        '422': {description: Invalid expected revision}
        '503': {description: Availability storage or complete target coverage unavailable}
  /api/v1/model-management/gateways/{gateway_profile_id}/budget-readiness:
    post:
      operationId: checkGatewayBudgetReadiness
      summary: Verify budget delegation and candidate fence identity
      description: Owner-only bounded catalog checks on the configured target. Does not invoke a model or mutate the fence. Reports actual and expected status separately.
      security: [{sessionCookie: []}]
      parameters:
      - name: gateway_profile_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Observed identity and fence checks
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: ../../openapi.yaml#/components/schemas/BudgetDelegationReadiness}
        '403': {description: Owner session or allowed write origin required}
        '409': {description: Target or isolated candidate prerequisites are not satisfied}
        '503': {description: Verification could not be completed}
  /api/v1/model-management/gateways/{gateway_profile_id}/budget-execution-verification:
    post:
      operationId: verifyGatewayBudgetExecution
      summary: Verify one isolated two-scope budget invocation
      description: Requires an Owner and an exact paused candidate across every shared budget target. Uses the configured person and Application identities. Sends at most one nonstreaming request with 32 output tokens. Unknown outcomes do not authorize replay. Reads both scope receipts without mutating budgets or settlement.
      security: [{sessionCookie: []}]
      parameters:
      - name: gateway_profile_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ../../openapi.yaml#/components/schemas/BudgetExecutionVerificationRequest}
      responses:
        '200':
          description: Invocation outcome and independent before/after ledger observations
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: ../../openapi.yaml#/components/schemas/BudgetExecutionVerification}
        '403': {description: Owner session or required model access missing}
        '404': {description: Candidate Application subscription was not found}
        '409': {description: Exact candidate or shared fence identity is not ready}
        '422': {description: Only explicit application and model IDs are accepted}
        '503': {description: Verification resources are unavailable}
  /api/v1/model-management/runtimes/{runtime_id}/check:
    parameters:
    - name: runtime_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      tags: [Model Management]
      operationId: runtimeCheckPlan
      summary: Preview an Owner connection diagnostic
      description: Reads eligible text models, trusted Gateway routes and the API identity's scoped system-subscription permissions. Does not read subscription keys or issue inference. Historical diagnostic results do not expire; configuration applicability is not a live availability assertion.
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Explicit diagnostic choices and access evidence
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: ../../openapi.yaml#/components/schemas/RuntimeCheckPlan}
        '403': {description: An Owner session is required}
        '404': {description: Connection not found}
    post:
      tags: [Model Management]
      operationId: checkRuntime
      summary: Run one explicitly selected connection diagnostic
      description: Requires an Owner session and same-origin checks. Rechecks target, system subscription, trusted endpoint and configuration before a single non-streaming request with at most 64 output tokens. No automatic retry. A 60-second per-connection claim prevents concurrent diagnostics; unknown outcomes are not availability or zero-cost evidence.
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ../../openapi.yaml#/components/schemas/RuntimeCheckSelection}
      responses:
        '200':
          description: Timestamped diagnostic outcome and configuration applicability
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: ../../openapi.yaml#/components/schemas/RuntimeHealth}
        '403': {description: An Owner session is required}
        '409': {description: 'Access, target, configuration or diagnostic ownership changed'}
        '422': {description: Explicit model and Gateway selection is required}
        '429':
          description: A diagnostic is running or recently completed
          headers:
            Retry-After:
              schema: {type: string}
  /api/v1/model-management/rollouts:
    post:
      tags: [Model Control Plane]
      operationId: createMultiTargetRollout
      summary: Atomically queue model publication to multiple APIM targets
      description: Requires the existing publication Owner session and write-origin checks plus MULTI_APIM_TARGET_ROLLOUT_ENABLED. Accepts two to twenty distinct registered targets. All plans are prepared before one queue transaction. A canonical child supplies the shared logical model and complete price identity; target-specific runtime and upstream bindings remain separate. The parent is idempotent, excludes credentials from its request identity, and reports independent child outcomes rather than distributed atomic promotion.
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/MultiTargetPublicationCreate
      responses:
        '202':
          description: Parent intent, safe child publication views and parent status URL.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/MultiTargetPublicationRequestAccepted
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '422':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '503':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
    get:
      tags: [Model Control Plane]
      operationId: listMultiTargetRollouts
      summary: List recent multi-target rollout intents and derived status
      description: Requires the publication Owner session. Status is derived from every child; mixed terminal success and failure is partial. This endpoint performs no ARM or inference requests.
      security:
      - sessionCookie: []
      parameters:
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Recent parent rollout states.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/MultiTargetRolloutList
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '422':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/model-management/rollouts/{rollout_id}:
    get:
      tags: [Model Control Plane]
      operationId: getMultiTargetRollout
      summary: Read one multi-target rollout with child publication identities
      description: Requires the publication Owner session. Failed children retain their own existing publication retry and authorization-resume workflows; successful targets are not implicitly replayed or rolled back.
      security:
      - sessionCookie: []
      parameters:
      - name: rollout_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Parent intent with current derived status and child references.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/MultiTargetRollout
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '422':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/model-management/apim-targets/{gateway_profile_id}/self-hosted-gateway-provisions:
    post:
      tags: [Model Control Plane]
      operationId: createSelfHostedGateway
      summary: Create an APIM Self-hosted Gateway and associate the target API
      description: Owner-only, same-origin, opt-in durable creation. Turnstile generates the native ID from the target and Idempotency-Key; the client never supplies a native ID. Repeated identical submissions return the same operation. The worker checks permissions and ownership, creates only the named child configuration, and verifies API membership. Success means configuration ready, not a running container. Server installation remains customer-controlled.
      security:
      - sessionCookie: []
      parameters:
      - name: gateway_profile_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/SelfHostedGatewayCreate
      responses:
        '202':
          description: Durable creation accepted; inspect status_url for actual completion.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/GatewayReleaseOperationAccepted
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '422':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/model-management/self-hosted-gateway-provisions:
    get:
      tags: [Model Control Plane]
      operationId: listSelfHostedGatewayProvisions
      summary: List Owner-visible Gateway creation progress and failures
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Creation capability and durable tasks; never contains bootstrap tokens.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/SelfHostedGatewayProvisionOperations
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/model-management/self-hosted-gateway-provisions/{operation_id}/retry:
    post:
      tags: [Model Control Plane]
      operationId: retrySelfHostedGatewayProvision
      summary: Retry the same failed Gateway creation without changing its native ID
      description: Requires an Owner session and the write-origin check. Preserves the original task identity, configuration and failure audit. The worker reads the existing resource before any conditional write; foreign resources are never adopted by this operation.
      security:
      - sessionCookie: []
      parameters:
      - name: operation_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '202':
          description: Same operation requeued or already active.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/GatewayReleaseOperationAccepted
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/model-management/self-hosted-gateways/{deployment_id}/bootstrap:
    post:
      tags: [Model Control Plane]
      operationId: getSelfHostedGatewayBootstrap
      summary: Generate short-lived Gateway-specific Docker startup credentials
      description: Requires an Owner session, the write-origin check and an unchanged active deployment owned by a succeeded creation task. Verifies the live APIM Gateway and API association. Returns a GatewayKey token only in the environment file, never a model subscription key. No token is persisted in tasks, logs or audits. Tokens last at most 720 hours. Regenerate from Turnstile for renewal; recreating the named container interrupts its connections.
      security:
      - sessionCookie: []
      parameters:
      - name: deployment_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/SelfHostedGatewayBootstrapRequest
      responses:
        '200':
          description: Sensitive environment file and credential-free container commands.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
            Pragma:
              schema: {type: string, const: no-cache}
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/SelfHostedGatewayBootstrap
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '502':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/model-management/apim-targets/{gateway_profile_id}/self-hosted-gateways:
    post:
      tags: [Model Control Plane]
      operationId: addSelfHostedGateway
      summary: Associate Self-hosted Gateway metadata with an APIM target
      description: Requires an Owner session, the write-origin check and the lifecycle feature. Records customer-managed hosting metadata only. Does not create or modify an Azure Gateway or container. New or re-added entries require fresh reachability evidence.
      security:
      - sessionCookie: []
      parameters:
      - name: gateway_profile_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/SelfHostedGatewayWrite
      responses:
        '201':
          description: Saved deployment metadata and persisted inventory.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/GatewayDeploymentTopology
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '422':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '503':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/model-management/self-hosted-gateways/{deployment_id}/name:
    patch:
      tags: [Model Control Plane]
      operationId: renameSelfHostedGateway
      summary: Change only the Self-hosted Gateway display name
      description: Requires an Owner session, the write-origin check and lifecycle availability. Trims a nonblank display name. Routing, credentials, inventory and retirement state are unchanged. Returns a minimal acknowledgement without a post-write topology read.
      security:
      - sessionCookie: []
      parameters:
      - name: deployment_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/SelfHostedGatewayNameWrite
      responses:
        '204':
          description: Display name saved; no response body.
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '422':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '503':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/model-management/self-hosted-gateways/{deployment_id}/validations:
    post:
      tags: [Model Control Plane]
      operationId: validateSelfHostedGateway
      summary: Validate a trusted Self-hosted Gateway endpoint without inference
      description: Requires an Owner session and the write-origin check. Requires present ARM declaration, API association and either a matching declared hostname or the exact trusted endpoint. Sends the target credential only after these checks. GET models follows no redirects; the timestamped result records reachability, not live health or physical migration.
      security:
      - sessionCookie: []
      parameters:
      - name: deployment_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Updated deployment with successful reachability evidence.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/GatewayDeploymentTopology
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '503':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/model-management/self-hosted-gateways/{deployment_id}/removal-preview:
    get:
      tags: [Model Control Plane]
      operationId: previewSelfHostedGatewayRemoval
      summary: Preview metadata retirement blockers
      description: Requires an Owner session and lifecycle availability. Lists model dependencies and in-flight publications without modifying the Gateway or its Azure resources.
      security:
      - sessionCookie: []
      parameters:
      - name: deployment_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Current retirement blockers and model dependencies.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/SelfHostedGatewayRemovalPreview
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '503':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/model-management/self-hosted-gateways/{deployment_id}:
    delete:
      tags: [Model Control Plane]
      operationId: retireSelfHostedGateway
      summary: Retire a Self-hosted Gateway association while preserving history
      description: Requires an Owner session, the write-origin check and lifecycle availability. Rechecks model and in-flight publication dependencies within persistence before retirement. No Azure resource or container is deleted. Re-adding the same target/native identity reuses its stable deployment ID and resets reachability.
      security:
      - sessionCookie: []
      parameters:
      - name: deployment_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Confirmed retirement with its prior dependency preview.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/SelfHostedGatewayRemovalPreview
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '503':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/model-management/self-hosted-gateways/{deployment_id}/apim-association:
    put:
      tags: [Model Control Plane]
      operationId: changeSelfHostedGatewayAssociation
      summary: Change platform association to another registered APIM target
      description: Requires an Owner session, the write-origin check and lifecycle availability. Refuses occupied destinations, unsupported targets, model dependencies and in-flight publications. Persists the destination and retires the source atomically. This is metadata reassociation, not a container, token or Azure Gateway migration.
      security:
      - sessionCookie: []
      parameters:
      - name: deployment_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/SelfHostedGatewayAssociationChange
      responses:
        '200':
          description: Destination deployment with fresh unknown reachability.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/GatewayDeploymentTopology
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '422':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '503':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/model-management/apim-onboarding:
    get:
      tags: [Model Control Plane]
      operationId: listApimOnboardingOperations
      summary: List the latest initialization operation per APIM target
      description: Requires an Owner session. Reads durable task state and capability without contacting Azure. Credentials are never returned.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Initialization availability and persisted operations.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/ApimOnboardingOperations
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
    post:
