schemas:
  MultiTargetRollout:
    properties:
      schema_version: {type: integer, const: 1, title: Schema Version, default: 1}
      id: {type: string, format: uuid, title: Id}
      kind:
        $ref: ../../openapi.yaml#/components/schemas/TargetRolloutKind
      logical_model_id:
        anyOf:
        - {type: string, format: uuid}
        - {type: 'null'}
        title: Logical Model Id
      status:
        $ref: ../../openapi.yaml#/components/schemas/TargetRolloutStatus
      children:
        items:
          $ref: ../../openapi.yaml#/components/schemas/TargetRolloutChild
        type: array
        minItems: 1
        title: Children
      created_by: {type: string, maxLength: 320, minLength: 1, title: Created By}
      created_at: {type: string, format: date-time, title: Created At}
    additionalProperties: false
    type: object
    required: [id, kind, status, children, created_by, created_at]
    title: MultiTargetRollout
  MultiTargetRolloutList:
    properties:
      items:
        items:
          $ref: ../../openapi.yaml#/components/schemas/MultiTargetRollout
        type: array
        title: Items
    additionalProperties: false
    type: object
    required: [items]
    title: MultiTargetRolloutList
  TargetRolloutChild:
    properties:
      apim_target_id: {type: string, format: uuid, title: Apim Target Id}
      publication_id: {type: string, format: uuid, title: Publication Id}
      required: {type: boolean, title: Required, default: true}
      status:
        $ref: ../../openapi.yaml#/components/schemas/TargetRolloutChildStatus
    additionalProperties: false
    type: object
    required: [apim_target_id, publication_id, status]
    title: TargetRolloutChild
  TargetRolloutChildStatus:
    type: string
    enum: [queued, in_progress, succeeded, failed, rolling_back, rolled_back]
    title: TargetRolloutChildStatus
  TargetRolloutKind:
    type: string
    enum: [model_add, model_remove, credential_rotation, route_reconcile]
    title: TargetRolloutKind
  TargetRolloutStatus:
    type: string
    enum: [queued, in_progress, succeeded, partial, failed, rolling_back, rolled_back]
    title: TargetRolloutStatus
  SelfHostedGatewayWrite:
    properties:
      native_gateway_id: {type: string, maxLength: 80, minLength: 1, title: Native Gateway Id}
      display_name: {type: string, maxLength: 120, minLength: 1, title: Display Name}
      endpoint_url: {type: string, maxLength: 2083, minLength: 1, format: uri, title: Endpoint Url}
      location:
        anyOf:
        - {type: string, maxLength: 128, minLength: 1}
        - {type: 'null'}
        title: Location
      hosting_mode:
        $ref: ../../openapi.yaml#/components/schemas/GatewayHostingMode
        default: other
      release_gate:
        $ref: ../../openapi.yaml#/components/schemas/GatewayReleaseGate
        default: required
    additionalProperties: false
    type: object
    required: [native_gateway_id, display_name, endpoint_url]
    title: SelfHostedGatewayWrite
  SelfHostedGatewayNameWrite:
    properties:
      display_name: {type: string, maxLength: 120, minLength: 1, title: Display Name}
    additionalProperties: false
    type: object
    required: [display_name]
    title: SelfHostedGatewayNameWrite
  SelfHostedGatewayAssociationChange:
    properties:
      native_gateway_id: {type: string, maxLength: 80, minLength: 1, title: Native Gateway Id}
      display_name: {type: string, maxLength: 120, minLength: 1, title: Display Name}
      endpoint_url: {type: string, maxLength: 2083, minLength: 1, format: uri, title: Endpoint Url}
      location:
        anyOf:
        - {type: string, maxLength: 128, minLength: 1}
        - {type: 'null'}
        title: Location
      hosting_mode:
        $ref: ../../openapi.yaml#/components/schemas/GatewayHostingMode
        default: other
      release_gate:
        $ref: ../../openapi.yaml#/components/schemas/GatewayReleaseGate
        default: required
      apim_target_id: {type: string, format: uuid, title: Apim Target Id}
    additionalProperties: false
    type: object
    required: [native_gateway_id, display_name, endpoint_url, apim_target_id]
    title: SelfHostedGatewayAssociationChange
  SelfHostedGatewayRemovalPreview:
    properties:
      deployment_id: {type: string, format: uuid, title: Deployment Id}
      display_name: {type: string, title: Display Name}
      model_count: {type: integer, minimum: 0, title: Model Count}
      models:
        items:
          $ref: ../../openapi.yaml#/components/schemas/GatewayPublishedModelSummary
        type: array
        title: Models
        default: []
      removal_allowed: {type: boolean, title: Removal Allowed}
      blockers:
        items: {type: string}
        type: array
        title: Blockers
        default: []
    additionalProperties: false
    type: object
    required: [deployment_id, display_name, model_count, removal_allowed]
    title: SelfHostedGatewayRemovalPreview
  ApimOnboardingRequest:
    properties:
      tenant_id: {type: string, format: uuid, title: Tenant Id}
      resource_id: {type: string, maxLength: 1024, minLength: 1, title: Resource Id}
      name:
        anyOf:
        - {type: string, maxLength: 120, minLength: 1}
        - {type: 'null'}
        title: Name
    additionalProperties: false
    type: object
    required: [tenant_id, resource_id]
    title: ApimOnboardingRequest
  ApimOnboardingPlan:
    properties:
      request:
        $ref: ../../openapi.yaml#/components/schemas/ApimOnboardingRequest
      gateway_profile_id: {type: string, format: uuid, title: Gateway Profile Id}
      service_name: {type: string, title: Service Name}
      service_tier: {type: string, title: Service Tier}
      location: {type: string, title: Location}
      managed_gateway_origin:
        type: string
        maxLength: 2083
        minLength: 1
        format: uri
        title: Managed Gateway Origin
      api_id: {type: string, title: Api Id}
      api_path: {type: string, title: Api Path}
      dashboard_subscription_id: {type: string, title: Dashboard Subscription Id}
      probe_subscription_id: {type: string, title: Probe Subscription Id}
      initial_monthly_token_limit:
        type: integer
        minimum: 1
        title: Initial Monthly Token Limit
        default: 100000
      initial_tokens_per_minute:
        type: integer
        maximum: 2147483647
        minimum: 1
        title: Initial Tokens Per Minute
        default: 100000
      ready: {type: boolean, title: Ready}
      blockers:
        items: {type: string}
        type: array
        title: Blockers
      steps:
        items: {type: string}
        type: array
        title: Steps
      confirmation_sha256:
        type: string
        pattern: ^[0-9a-f]{64}$
        title: Confirmation Sha256
    additionalProperties: false
    type: object
    required:
    - request
    - gateway_profile_id
    - service_name
    - service_tier
    - location
    - managed_gateway_origin
    - api_id
    - api_path
    - dashboard_subscription_id
    - probe_subscription_id
    - ready
    - confirmation_sha256
    title: ApimOnboardingPlan
  ApimOnboardingStart:
    properties:
      request:
        $ref: ../../openapi.yaml#/components/schemas/ApimOnboardingRequest
      confirmation_sha256:
        type: string
        pattern: ^[0-9a-f]{64}$
        title: Confirmation Sha256
    additionalProperties: false
    type: object
    required: [request, confirmation_sha256]
    title: ApimOnboardingStart
  ApimOnboardingOperations:
    properties:
      available: {type: boolean, title: Available}
      unavailable_reason:
        anyOf:
        - {type: string}
        - {type: 'null'}
        title: Unavailable Reason
      items:
        items:
          $ref: ../../openapi.yaml#/components/schemas/GatewayReleaseOperation
        type: array
        title: Items
    additionalProperties: false
    type: object
    required: [available]
    title: ApimOnboardingOperations
  GatewayDeploymentScope:
    additionalProperties: false
    properties:
      mode:
        $ref: ../../openapi.yaml#/components/schemas/GatewayDeploymentScopeMode
        default: all
      deployment_ids:
        default: []
        items: {format: uuid, type: string}
        title: Deployment Ids
        type: array
    title: GatewayDeploymentScope
    type: object
  GatewayDeploymentScopeMode:
    enum: [all, selected]
    title: GatewayDeploymentScopeMode
    type: string
  ApimTarget:
