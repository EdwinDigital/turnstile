        minimum: 0.0
        default: 0
      agent_users:
        type: integer
        minimum: 0.0
        default: 0
      chat_users:
        type: integer
        minimum: 0.0
        default: 0
      interactions:
        type: integer
        minimum: 0.0
        default: 0
      generations:
        type: integer
        minimum: 0.0
        default: 0
      acceptances:
        type: integer
        minimum: 0.0
        default: 0
      loc_added:
        type: integer
        minimum: 0.0
        default: 0
      loc_deleted:
        type: integer
        minimum: 0.0
        default: 0
      ai_credits_used:
