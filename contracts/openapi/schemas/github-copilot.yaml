      generations:
        type: integer
        minimum: 0.0
        default: 0
      acceptances:
        type: integer
        minimum: 0.0
        default: 0
      loc_added:
        type: integer
        minimum: 0.0
        default: 0
      loc_deleted:
        type: integer
        minimum: 0.0
        default: 0
    additionalProperties: false
