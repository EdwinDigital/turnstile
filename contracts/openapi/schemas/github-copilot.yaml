      seats:
        type: integer
        minimum: 0.0
        default: 0
      active_users:
        type: integer
        minimum: 0.0
        default: 0
      interactions:
        type: integer
        minimum: 0.0
        default: 0
      generations:
        type: integer
        minimum: 0.0
        default: 0
      acceptances:
        type: integer
        minimum: 0.0
        default: 0
      acceptance_rate:
