schemas:
  CopilotConnectionSummary:
    properties:
      id:
        type: string
        format: uuid
      organization:
        type: string
      display_name:
        type: string
      credential_configured:
        type: boolean
      credential_hint:
        type:
        - string
        - 'null'
      write_enabled:
        type: boolean
      is_default:
        type: boolean
    additionalProperties: false
    type: object
    required:
    - id
    - organization
    - display_name
    - credential_configured
    - write_enabled
    - is_default
    title: CopilotConnectionSummary
  CopilotConnectionWrite:
    properties:
      organization:
        type: string
        maxLength: 39
        minLength: 1
        pattern: ^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$
      token:
        type: string
        minLength: 8
        format: password
        writeOnly: true
      write_enabled:
        type: boolean
        default: false
      set_default:
        type: boolean
        default: true
    additionalProperties: false
    type: object
    required:
    - organization
    - token
    title: CopilotConnectionWrite
  CopilotStatus:
    properties:
      configured:
        type: boolean
      oauth_configured:
        type: boolean
        default: false
      viewer_role:
        type: string
        enum:
        - owner
        - member
      viewer_github_login:
        type:
        - string
        - 'null'
      connections:
        items:
          $ref: ../../openapi.yaml#/components/schemas/CopilotConnectionSummary
        type: array
    additionalProperties: false
    type: object
    required:
    - configured
    - viewer_role
    - viewer_github_login
    - connections
    title: CopilotStatus
  CopilotOAuthConfigWrite:
    properties:
      client_id:
        type: string
        maxLength: 255
        minLength: 1
      client_secret:
        type:
        - string
        - 'null'
        minLength: 1
        format: password
        writeOnly: true
      callback_url:
        type:
        - string
        - 'null'
        maxLength: 1000
    additionalProperties: false
    type: object
    required:
    - client_id
    title: CopilotOAuthConfigWrite
  CopilotOAuthConfigSummary:
    properties:
      configured:
        type: boolean
      client_id:
        type:
        - string
        - 'null'
      client_secret_hint:
        type:
        - string
        - 'null'
      callback_url:
        type:
        - string
        - 'null'
      effective_callback_url:
        type: string
    additionalProperties: false
    type: object
    required:
    - configured
    - effective_callback_url
    title: CopilotOAuthConfigSummary
  CopilotIdentityWrite:
    properties:
      github_login:
        type: string
        maxLength: 39
        minLength: 1
        pattern: ^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$
    additionalProperties: false
    type: object
    required:
    - github_login
    title: CopilotIdentityWrite
  CopilotIdentityMapping:
    properties:
      app_user_id:
        type: string
        format: uuid
      email:
        type: string
      display_name:
        type:
        - string
        - 'null'
      github_login:
        type:
        - string
        - 'null'
    additionalProperties: false
    type: object
    required:
    - app_user_id
    - email
    - display_name
    - github_login
    title: CopilotIdentityMapping
  CopilotUsageTotals:
